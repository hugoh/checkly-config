name: checkly-deploy
description: Install dependencies and deploy (or preview) a Checkly monitoring-as-code project
inputs:
  checkly-api-key:
    description: Checkly User API Key
    required: true
  checkly-account-id:
    description: Checkly Account ID
    required: true
  preview:
    description: Run `checkly deploy --preview` instead of `checkly deploy --force`
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Deploy Checkly project
      if: inputs.preview != 'true'
      shell: bash
      env:
        CHECKLY_API_KEY: ${{ inputs.checkly-api-key }}
        CHECKLY_ACCOUNT_ID: ${{ inputs.checkly-account-id }}
      run: bunx checkly deploy --force

    - name: Preview Checkly deployment
      if: inputs.preview == 'true'
      shell: bash
      env:
        CHECKLY_API_KEY: ${{ inputs.checkly-api-key }}
        CHECKLY_ACCOUNT_ID: ${{ inputs.checkly-account-id }}
      run: bunx checkly deploy --preview
